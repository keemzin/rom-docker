[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bridge-mysql]
command=socat TCP-LISTEN:3306,fork,reuseaddr,bind=127.0.0.1 TCP:db:3306
autostart=true
autorestart=true
priority=5

[program:bridge-redis]
command=socat TCP-LISTEN:6379,fork,reuseaddr,bind=127.0.0.1 TCP:redis:6379
autostart=true
autorestart=true
priority=5

[program:bridge-game]
command=socat TCP-LISTEN:7080,fork,reuseaddr,bind=127.0.0.1 TCP:game:7080
autostart=true
autorestart=true
priority=5
